<h2 style="margin-top: 0; color: #111827">Reset your MobPae password</h2>

<p>Hello <strong>{{name}}</strong>,</p>

<p>
  We received a request to reset your MobPae password. This link is valid for
  15 minutes.
</p>

<table cellpadding="0" cellspacing="0" style="margin: 24px 0">
  <tr>
    <td
      style="
        background: #6c4cff;
        border-radius: 12px;
        padding: 14px 22px;
        text-align: center;
      "
    >
      <a
        href="{{resetUrl}}"
        style="
          color: #ffffff;
          font-size: 14px;
          font-weight: 700;
          text-decoration: none;
        "
      >
        Reset Password
      </a>
    </td>
  </tr>
</table>

<p>If you did not request this, you can ignore this email.</p>

<p>
  Regards,<br />
  MobPae Team
</p>
