<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{title}}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background: #fff7ed;
      font-family: Inter, Arial, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 40px 20px"
    >
      <tr>
        <td align="center">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="background: #ffffff; border-radius: 16px; overflow: hidden"
          >
            <!-- Header -->

            <tr>
              <td
                style="background: #c4522a; padding: 32px; text-align: center"
              >
                <h1
                  style="
                    margin: 0;
                    color: #ffffff;
                    font-size: 30px;
                    font-weight: 700;
                    letter-spacing: -0.5px;
                  "
                >
                  MobPae
                </h1>

                <p
                  style="
                    margin-top: 10px;
                    color: #ffffff;
                    font-size: 14px;
                    font-weight: 500;
                    opacity: 0.95;
                  "
                >
                  Beating Your Month End Crunch
                </p>
              </td>
            </tr>

            <!-- Content -->

            <tr>
              <td style="padding: 40px; color: #111827">{{content}}</td>
            </tr>

            <!-- Footer -->

            <tr>
              <td
                style="
                  border-top: 1px solid #e5e7eb;
                  padding: 24px;
                  text-align: center;
                "
              >
                <p style="margin: 0; color: #6b7280; font-size: 13px">
                  Need help? Reach us at support@mobpae.com
                </p>

                <p style="margin-top: 8px; color: #6b7280; font-size: 13px">
                  www.mobpae.com
                </p>

                <p style="margin-top: 12px; color: #9ca3af; font-size: 12px">
                  © {{year}} MobPae. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
